# t630 production stack: Portainer stack 8 on t630 polls this file on master and redeploys when it changes.
# CI rewrites the image line after every master build (see .github/workflows/docker-publish.yml), so a
# push to master is a deploy. To roll back, revert the "Deploy sha-…" commit or pin an older sha- tag.
services:
  fanManager:
    image: ghcr.io/joshuawowk/t630-web-fan-manager:sha-20a12a74a5e418a0c4496228dd1f38c19c40ff29 # set by CI
    restart: unless-stopped
    # Time for the app to hand the fans back to the iDRAC before Docker kills it
    stop_grace_period: 30s
    ports:
      - 8085:8080 # external:internal
    volumes:
      - /home/jwowk/docker/serverManager:/usr/src/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
