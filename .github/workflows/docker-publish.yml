name: Docker

# Every push that touches the app builds, tests and publishes an image tagged sha-<commit> and <branch>.
# On master the deploy job then points docker-compose.yml at that image and commits it; Portainer stack 8
# on t630 polls master and redeploys. A docker-compose.yml-only push skips the build and deploys as-is.
on:
  push:
    branches:
      - "**"
    # Publish `v1.2.3` tags as releases
    tags:
      - v*
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  image:
    needs: test
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint ipmitool smoke-test:local -V
          docker run -d --name smoke -p 8080:8080 smoke-test:local
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/info
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0
          docker logs smoke
          docker rm smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: image
    name: Deploy to t630 (GitOps)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Point docker-compose.yml at the new image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          current=$(grep -oE 'sha-[0-9a-f]{40}' docker-compose.yml | head -1 | cut -c5-)
          # A newer master build may already have deployed; never move the stack backwards
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            echo "docker-compose.yml already points at newer sha-$current"
            exit 0
          fi
          sed -i -E "0,/^(\s*image:\s*)\S+/s##\1${image}#" docker-compose.yml
          if git diff --quiet; then
            echo "docker-compose.yml already points at $image"
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy sha-${GITHUB_SHA::7} to t630 [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          exit 1
