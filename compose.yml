# Sample deployment. Change the published port and data path to suit.
services:
  serverManager:
    image: ghcr.io/joshuawowk/t630-web-fan-manager:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - 8083:8080 # external:internal
    volumes:
      - /srv/serverManager:/usr/src/app/data
